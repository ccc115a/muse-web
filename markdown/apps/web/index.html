<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MD Editor · 類 VSCode Markdown 工作區</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header id="topbar">
    <span class="logo">MD Editor</span>
    <span class="hint">顯示與 GitHub 一致 · 純靜態 · git 操作請在 VSCode 自己做</span>
    <div class="spacer"></div>
    <nav id="menubar">
      <div class="menu" data-menu="file">
        <button class="menu-title">檔案</button>
        <div class="menu-drop" hidden>
          <button id="open-folder">開啟資料夾</button>
          <button id="new-file">新增檔案</button>
          <button id="new-folder">新增資料夾</button>
          <div class="sep"></div>
          <button id="save-file">儲存 <span class="kbd">Ctrl+S</span></button>
          <button id="download-html">匯出 .html</button>
        </div>
      </div>
      <div class="menu" data-menu="view" id="menu-view">
        <button class="menu-title">檢視</button>
        <div class="menu-drop" hidden>
          <button data-view="edit">編輯</button>
          <button data-view="split" class="on">並排</button>
          <button data-view="preview">預覽</button>
        </div>
      </div>
      <div class="menu" data-menu="project">
        <button class="menu-title">專案</button>
        <div class="menu-drop" hidden>
          <button id="project-info">專案資訊</button>
          <button id="project-settings">專案設定</button>
        </div>
      </div>
      <div class="menu" data-menu="publish">
        <button class="menu-title">發佈</button>
        <div class="menu-drop" hidden>
          <button id="publish-site">發佈靜態網站</button>
          <button id="view-gh">檢視 GitHub 網站</button>
        </div>
      </div>
    </nav>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div id="explorer-head">
        <span id="folder-name">未開啟資料夾</span>
        <span id="backend-tag" class="tag"></span>
      </div>
      <div id="tree"></div>
      <div id="tree-hint" class="hint">按「開啟資料夾」載入本機目錄（Chromium 可直接寫回磁碟；Firefox 會改用唯讀＋下載存檔）。</div>
    </aside>
    <main id="main">
      <div id="tabs"></div>
      <div id="workarea" class="split">
        <div id="editor"></div>
        <article id="preview" class="markdown-body"></article>
      </div>
    </main>
  </div>

  <footer id="statusbar"><span id="status">就緒</span></footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
