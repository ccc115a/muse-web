name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/flowboard/backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo check
      - run: cargo test
      - run: cargo clippy -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/flowboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: examples/flowboard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build --release --manifest-path backend/Cargo.toml
      - run: npm run build --prefix frontend
      - run: npm ci --prefix e2e
      - run: npx playwright install chromium --only-shell
        working-directory: examples/flowboard/e2e
      - run: npx playwright test
        working-directory: examples/flowboard/e2e

  image:
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flowboard:${{ github.sha }} examples/flowboard
